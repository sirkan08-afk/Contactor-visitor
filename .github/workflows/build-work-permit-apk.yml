name: Build Work Permit Android APK
on:
  workflow_dispatch:
  push:
    branches: [work-permit-online]
    paths:
      - 'android-work-permit/**'
      - '.github/workflows/build-work-permit-apk.yml'
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-work-permit
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build installable debug APK
        run: gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Work-Permit-Android-APK
          path: android-work-permit/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
