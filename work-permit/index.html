<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Work Permit Online</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;background:#f3f6f4;color:#1c2925;font:16px system-ui}.head{background:#123b35;color:white;padding:22px}.wrap{max-width:900px;margin:20px auto;padding:0 14px}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tabs button,.btn{padding:12px 16px;border:0;border-radius:10px;background:#176b55;color:white;font-weight:700}.tabs button{background:#dce9e3;color:#21443c}.tabs .active{background:#176b55;color:white}.panel{background:white;border:1px solid #dce6e1;border-radius:16px;padding:18px;margin-top:14px}.hidden{display:none}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:5px}.full{grid-column:1/-1}input,select,textarea{padding:12px;border:1px solid #cbd8d2;border-radius:9px;font:inherit;width:100%}textarea{min-height:80px}.notice{padding:12px;background:#edf6f1;border-radius:9px;margin:10px 0}.muted{color:#667770;font-size:13px}.item{padding:12px;border:1px solid #dce6e1;border-radius:10px;margin:8px 0}@media(max-width:600px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body><header class="head"><small>U KHAOCHICHAN PATTAYA · SECURITY DEPARTMENT</small><h1>Work Permit</h1>ระบบยื่นคำขอและตรวจอนุมัติงานผู้รับเหมา</header><main class="wrap"><nav class="tabs"><button class="active" data-tab="request">ยื่นคำขอ</button><button data-tab="track">ติดตามคำขอ</button><button data-tab="staff">เจ้าหน้าที่ / ผู้ตรวจ</button></nav><section id="request" class="panel"><h2>แบบฟอร์มขออนุญาตทำงาน</h2><div class="notice">สแกน QR แล้วกรอกได้ทันที ไม่ต้องล็อกอิน</div><form id="requestForm" class="grid"><div class="field"><label>ชื่อผู้รับเหมา / ผู้ยื่นคำขอ *</label><input name="applicant_name" required></div><div class="field"><label>ชื่อผู้ควบคุมงาน *</label><input name="supervisor_name" required></div><div class="field"><label>บริษัทผู้รับเหมา *</label><input name="company_name" required></div><div class="field"><label>เบอร์ติดต่อ *</label><input name="contact_phone" required></div><div class="field"><label>แผนก</label><select name="department"><option>Engineering</option><option>Housekeeping</option><option>F&B</option><option>Security</option><option>Other</option></select></div><div class="field"><label>ประเภทงาน *</label><select name="work_type" required><option value="">เลือกประเภท</option><option>Hot Work</option><option>งานที่สูง</option><option>งานไฟฟ้า</option><option>ที่อับอากาศ</option><option>ซ่อมบำรุงทั่วไป</option><option>อื่น ๆ</option></select></div><div class="field full"><label>ชื่องาน *</label><input name="work_title" required></div><div class="field full"><label>รายละเอียด / วิธีปฏิบัติงาน</label><textarea name="work_description"></textarea></div><div class="field"><label>สถานที่ทำงาน *</label><input name="work_location" required></div><div class="field"><label>จำนวนคน *</label><input name="team_size" type="number" min="1" value="1" required></div><div class="field"><label>วันที่เริ่ม *</label><input name="start_date" type="date" required></div><div class="field"><label>วันที่สิ้นสุด</label><input name="end_date" type="date"></div><div class="field"><label>เวลาเริ่ม</label><input name="start_time" type="time"></div><div class="field"><label>เวลาสิ้นสุด</label><input name="end_time" type="time"></div><div class="field full"><label>เครื่องมือ / อุปกรณ์</label><textarea name="tools"></textarea></div><div class="field full"><button class="btn">ส่งคำขอ Work Permit</button><div id="requestMsg" class="muted">รอติดตั้ง Edge Function เพื่อรับคำขอแบบไม่ล็อกอินอย่างปลอดภัย</div></div></form></section><section id="track" class="panel hidden"><h2>ติดตามสถานะ</h2><form id="trackForm" class="grid"><div class="field"><label>เลข Work Permit</label><input name="permit_no" required></div><div class="field"><label>รหัสติดตาม</label><input name="tracking_code" required></div><div class="field full"><button class="btn">ตรวจสอบ</button></div></form><div id="trackMsg" class="muted">รอติดตั้งบริการตรวจรหัสติดตาม</div></section><section id="staff" class="panel hidden"><h2>เข้าสู่ระบบเจ้าหน้าที่</h2><form id="loginForm" class="grid"><div class="field"><label>อีเมล</label><input name="email" type="email" required></div><div class="field"><label>รหัสผ่าน</label><input name="password" type="password" required></div><div class="field full"><button class="btn">เข้าสู่ระบบ</button></div></form><div id="staffMsg"></div><div id="staffList"></div></section></main><script>const db=window.supabase.createClient('https://nldoneixnuapuzpeeznl.supabase.co','sb_publishable_igE41YhbVSgCQijy3nTCPg_3C-PyGiI');document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));['request','track','staff'].forEach(id=>document.getElementById(id).classList.toggle('hidden',id!==b.dataset.tab));});document.getElementById('requestForm').onsubmit=e=>{e.preventDefault();document.getElementById('requestMsg').textContent='หน้าฟอร์มพร้อมแล้ว แต่ยังไม่เปิดรับข้อมูลจนกว่าจะติดตั้ง Edge Function และตรวจข้อกำหนด created_by ในฐานข้อมูล';};document.getElementById('trackForm').onsubmit=e=>{e.preventDefault();document.getElementById('trackMsg').textContent='ระบบติดตามจะเปิดหลังติดตั้งบริการตรวจรหัสติดตาม';};document.getElementById('loginForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),r=await db.auth.signInWithPassword({email:f.get('email'),password:f.get('password')});if(r.error){document.getElementById('staffMsg').textContent=r.error.message;return;}document.getElementById('staffMsg').textContent='เข้าสู่ระบบแล้ว';load();};async function load(){const box=document.getElementById('staffList');box.textContent='กำลังโหลดรายการ';const r=await db.from('work_permits').select('id,permit_no,company_name,work_title,work_location,start_date,status,created_at').order('created_at',{ascending:false});if(r.error){box.textContent=r.error.message;return;}box.innerHTML='';(r.data||[]).forEach(p=>{const d=document.createElement('div');d.className='item';d.textContent=p.permit_no+' | '+p.company_name+' | '+p.work_title+' | '+p.status;box.append(d);});}</script></body></html>
